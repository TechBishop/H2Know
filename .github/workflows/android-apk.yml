name: Build & Release H2Know Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package or Build APK
        run: |
          if [ -f "release/H2Know-latest.apk" ]; then
            echo "Using pre-built signed APK from release/H2Know-latest.apk"
            cp release/H2Know-latest.apk H2Know-latest.apk
          else
            if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"
            fi
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              cp .env.example .env
            fi
            gradle assembleDebug --no-configuration-cache
            cp app/build/outputs/apk/debug/app-debug.apk H2Know-latest.apk
          fi

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: H2Know-Tester-APK
          path: H2Know-latest.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases (1-Tap Phone Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-test
          name: "H2Know — Latest Tester Build"
          body: |
            ### Install on Android Phone
            1. Tap **`H2Know-latest.apk`** below under **Assets** to download on your Android phone.
            2. Open the downloaded file and allow **Install unknown apps** if prompted.
          files: H2Know-latest.apk
          prerelease: true
          make_latest: true

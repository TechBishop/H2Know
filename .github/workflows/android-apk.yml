name: Build & Release H2Know Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout, Package APK, and Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

          if [ -f "release/H2Know-latest.apk" ]; then
            echo "Using pre-built signed APK from release/H2Know-latest.apk"
            cp release/H2Know-latest.apk H2Know-latest.apk
          else
            if [ -n "$ANDROID_HOME" ] && [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"
            fi
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            fi
            if [ ! -f ".env" ] && [ -f ".env.example" ]; then
              cp .env.example .env
            fi
            gradle assembleDebug --no-configuration-cache
            cp app/build/outputs/apk/debug/app-debug.apk H2Know-latest.apk
          fi

          if gh release view latest-test --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload latest-test H2Know-latest.apk --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create latest-test H2Know-latest.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "H2Know — Latest Tester Build" \
              --notes "Tap **H2Know-latest.apk** under Assets to download and install on your Android phone." \
              --prerelease
          fi

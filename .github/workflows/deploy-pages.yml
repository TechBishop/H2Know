name: Deploy H2Know HTML5 Web App to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-html5:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/checkout retries and avoids the hand-rolled fetch that died with
      # "curl 92 HTTP/2 stream was not closed cleanly" before _site was built.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Assemble site bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/release _site/icons _site/v2/icons
          cp index.html styles.css app.js data.js config.js sw.js manifest.json counties.json _site/
          cp index.html _site/404.html
          cp PRIVACY_POLICY.md _site/PRIVACY_POLICY.md
          if [ -d icons ]; then cp -r icons/. _site/icons/; fi
          # Keep a copy at /v2/ so a preview path survives alongside the root site.
          cp index.html styles.css app.js data.js config.js sw.js manifest.json counties.json _site/v2/
          if [ -d icons ]; then cp -r icons/. _site/v2/icons/; fi
          touch _site/.nojekyll
          if [ -f "release/H2Know-latest.apk" ]; then
            cp release/H2Know-latest.apk _site/release/H2Know-latest.apk
          fi

          # Stamp shell URLs so a returning browser cannot reuse an older stylesheet or script.
          python3 - << 'PY'
          import os
          import pathlib
          build = os.environ["GITHUB_SHA"]
          root = pathlib.Path("_site")
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".html", ".js"}:
                  continue
              text = path.read_text()
              if "__H2KNOW_BUILD__" not in text:
                  continue
              path.write_text(text.replace("__H2KNOW_BUILD__", build))
          PY

          # Also mirror to gh-pages branch so branch-based Pages configurations stay 100% in sync.
          # HTTP/1.1 avoids the same HTTP/2 disconnect that failed the old fetch.
          (
            cd _site
            git init -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config http.version HTTP/1.1
            git add -A
            git commit -m "Deploy H2Know web app (${GITHUB_SHA})"
            git -c http.version=HTTP/1.1 push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
          ) || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages environment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

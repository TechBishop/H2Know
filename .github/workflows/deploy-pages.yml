name: Deploy H2Know HTML5 Web App to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-html5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and publish HTML5 Web App to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

          mkdir -p _site/release
          cp index.html _site/index.html
          cp index.html _site/404.html
          cp manifest.json _site/manifest.json
          cp PRIVACY_POLICY.md _site/PRIVACY_POLICY.md
          touch _site/.nojekyll
          if [ -f "release/H2Know-latest.apk" ]; then
            cp release/H2Know-latest.apk _site/release/H2Know-latest.apk
          fi

          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy H2Know HTML5 Web App"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

          # Automatically enable/configure GitHub Pages to serve from the gh-pages branch if permitted
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 || \
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f "build_type=legacy" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 || true

          echo "### H2Know HTML5 Web App + Android APK Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published 1:1 Android Simulator Web App to branch: \`gh-pages\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct Android APK download included at: \`/release/H2Know-latest.apk\`" >> "$GITHUB_STEP_SUMMARY"


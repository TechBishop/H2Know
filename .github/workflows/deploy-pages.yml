name: Deploy H2Know HTML5 Web App to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-html5:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository and assemble 1:1 Android Simulator Web App bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

          rm -rf _site
          mkdir -p _site/release _site/icons _site/v2/icons
          cp index.html styles.css app.js data.js config.js sw.js manifest.json _site/
          cp index.html _site/404.html
          cp PRIVACY_POLICY.md _site/PRIVACY_POLICY.md
          if [ -d icons ]; then cp -r icons/. _site/icons/; fi
          # Keep a copy at /v2/ so a preview path survives alongside the root site.
          cp index.html styles.css app.js data.js config.js sw.js manifest.json _site/v2/
          if [ -d icons ]; then cp -r icons/. _site/v2/icons/; fi
          touch _site/.nojekyll
          if [ -f "release/H2Know-latest.apk" ]; then
            cp release/H2Know-latest.apk _site/release/H2Know-latest.apk
          fi

          # Also mirror to gh-pages branch so branch-based Pages configurations stay 100% in sync
          (
            cd _site
            git init -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Deploy H2Know 1:1 Android Simulator Web App (${GITHUB_SHA})"
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
          ) || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages environment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
